name: Deploy to Render

# Triggers a Render deploy on every push to main by calling the service's
# Deploy Hook. This exists because the Render <-> GitHub App webhook isn't
# installed on this repo (the service is connected via personal Git
# credentials), so Render's built-in "On Commit" auto-deploy never fires.
# The Deploy Hook URL is stored as the repo secret RENDER_DEPLOY_HOOK_URL.

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manually running it from the Actions tab too

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Triggering Render deploy for commit ${GITHUB_SHA}..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render responded with HTTP ${http_code}"
          # Render's Deploy Hook returns 200 (with a JSON body) on success.
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Deploy hook call failed (HTTP ${http_code})."
            exit 1
          fi
          echo "Deploy triggered successfully."
